{% extends "base.html" %}{% block heading %}Prediction lab{% endblock %}{% block content %}
<div class="welcome"><div><small>SYSTEMSENSE MODULE</small><h2>Prediction lab</h2><p>Forecast near-term CPU load from collected history.</p></div></div><article class="panel"><small>MODULE DATA</small><h3>Prediction lab</h3><button onclick="runPrediction()">Run 5-minute CPU prediction</button><div id="output" class="output">Prediction will appear here.</div></article>
{% endblock %}{% block scripts %}<script>async function runPrediction(){const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({horizon:5})});const d=await r.json();document.getElementById('output').innerHTML='<div class="forecast"><small>ESTIMATED CPU LOAD</small><strong>'+d.prediction+'%</strong><p>Model: '+d.model+'</p></div>'; }</script>{% endblock %}
